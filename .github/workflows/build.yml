name: Build installers

# Builds the Windows, macOS and Linux installers on GitHub runners and
# uploads them as run artifacts. This is how real installers are produced:
# Tauri bundles per-OS, so there is no cross-compiling from one machine.
#
# Trigger it manually (Actions tab -> Build installers -> Run workflow) or
# by pushing a version tag like v0.1.0. To turn artifacts into a public
# download later, add a release step (softprops/action-gh-release) and the
# signing secrets documented in README.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            slug: windows
          - name: macOS
            os: macos-latest
            bundles: dmg
            slug: macos
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            slug: linux

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # Toolchain: stable Rust for the shell, Node 20 for the Tauri CLI,
      # whose version is pinned by package-lock.json (npm ci).
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the Tauri CLI (pinned by lockfile)
        run: npm ci

      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: txtanoffer-notepad-${{ matrix.slug }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      # Publish this OS's installers to the public v0.1.0 release so anyone
      # can download them without a GitHub account (release asset URLs).
      # Each matrix job uploads only the files its own bundles produced.
      - name: Publish installers to the v0.1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: TxtAnOffer Notepad v0.1.0
          body: "The TxtAnOffer Notepad for your desk: Windows (.exe), Mac (.dmg) and Linux (.deb / .AppImage) installers. The notepad works on its own; linking your TxtAnOffer account is optional."
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
